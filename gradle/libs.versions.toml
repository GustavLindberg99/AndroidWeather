[versions]
agp = "9.0.1"
appcompatVersion = "1.7.1"
commonsText = "1.15.0"
firebaseCrashlyticsBuildtools = "3.0.6"
guava = "33.5.0-jre"
kotlin = "2.3.10"
coreKtx = "1.17.0"
legacySupportV4 = "1.0.0"
material = "1.13.0"
volley = "1.2.1"

[libraries]
androidx-appcompat-v161 = { module = "androidx.appcompat:appcompat", version.ref = "appcompatVersion" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-legacy-support-v4 = { module = "androidx.legacy:legacy-support-v4", version.ref = "legacySupportV4" }
commons-text = { module = "org.apache.commons:commons-text", version.ref = "commonsText" }
firebase-crashlytics-buildtools = { module = "com.google.firebase:firebase-crashlytics-buildtools", version.ref = "firebaseCrashlyticsBuildtools" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
volley = { module = "com.android.volley:volley", version.ref = "volley" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }

